name: Scrape job postings

on:
  schedule:
    - cron: "0 4 * * *"  # daily, 04:00 UTC
  workflow_dispatch:
  # Temporary: lets the workflow run from this branch before it is merged to main
  # (workflow_dispatch/schedule only work from the default branch). Remove on merge.
  push:
    branches: [feature/railway-deploy]
    paths: [.github/workflows/scrape.yml]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scrapers.run_once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_LEVELS: junior,mid,senior
          LOG_FILE: ${{ runner.temp }}/app.log
